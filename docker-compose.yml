services:
    # ----------------------------------------------------
    # 1. PHP-FPM Application Service (Windows Host)
    # ----------------------------------------------------
    contact-app-dev:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                USER_ID: 1000
                GROUP_ID: 1000
        user: "1000:1000"
        container_name: contact-app-dev
        restart: unless-stopped
        working_dir: /var/www/contact
        volumes:
            - .:/var/www/contact
            # - composer-cache:/var/www/.composer/cache
        networks:
            - apps_network

    # ----------------------------------------------------
    # 2. Nginx Web Server Service (Traefik Integration)
    # ----------------------------------------------------
    contact-nginx-dev:
        image: nginx:alpine
        container_name: contact-nginx-dev
        restart: always
        environment:
            - NGINX_ENVSUBST_DISABLE_ENV_POSTFIX=true
            - NGINX_ENTRYPOINT_LOCAL_RESOLVERS=false
        volumes:
            - .:/var/www/contact:ro
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - contact-app-dev
        networks:
            - apps_network
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=apps_network"

networks:
    apps_network:
        external: true
