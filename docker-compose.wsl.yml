services:
  # ----------------------------------------------------
  # 1. PHP-FPM Application Service (WSL2 Optimized)
  # ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile.dev
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    user: "1000:1000"
    container_name: dss-backoffice-api-app-dev
    restart: unless-stopped
    working_dir: /var/www/dss-backoffice-api
    volumes:
      - .:/var/www/dss-backoffice-api
    networks:
      - apps_network

  # ----------------------------------------------------
  # 2. Nginx Web Server Service (Traefik Integration)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: dss-backoffice-api-nginx-dev
    restart: unless-stopped
    volumes:
      - .:/var/www/dss-backoffice-api
      - ./.docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - apps_network

  # ----------------------------------------------------
  # 3. Queue Worker Service (WSL2 Optimized)
  # ----------------------------------------------------
  # worker:
  #   build:
  #     context: .
  #     dockerfile: .docker/php/Dockerfile.dev
  #     args:
  #       USER_ID: 1000
  #       GROUP_ID: 1000
  #   user: "1000:1000"
  #   container_name: dss-backoffice-api-worker-dev
  #   restart: unless-stopped
  #   working_dir: /var/www/dss-backoffice-api
  #   command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
  #   volumes:
  #     - .:/var/www/dss-backoffice-api
  #   depends_on:
  #     - app
  #   networks:
  #     - apps_network

networks:
  apps_network:
    external: true