server {
    listen 80;
    server_name localhost;

    root /var/www/contact/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 100M;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # บังคับเติม slash หากเข้า http://localhost/contact
    location = /contact {
        return 301 /contact/;
    }

    # จัดการทุกคำขอที่ขึ้นต้นด้วย /contact/
    location ^~ /contact/ {
        alias /var/www/contact/public/;
        try_files $uri $uri/ @contact_app;

        location ~ \.php$ {
            fastcgi_pass contact-app-dev:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/contact/public/index.php;
            fastcgi_read_timeout 300;
        }
    }

    # Rewrite ตัดคำว่า /contact ออก และส่ง REQUEST_URI ที่ตัดแล้วเข้า Laravel
    location @contact_app {
        rewrite ^/contact/(.*)$ /$1 break;
        fastcgi_pass contact-app-dev:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/contact/public/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param PATH_INFO $uri;
        fastcgi_read_timeout 300;
    }

    # กรณีเข้าผ่าน Root / ปกติ
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass contact-app-dev:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
