map $request_uri $clean_uri {
    ~*^/contact/(.*)$ /$1;
    default $request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name contact2.dss.local;

    root /var/www/contact/public;
    index index.php index.html;
    charset utf-8;

    server_tokens off;
    client_max_body_size 100M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # Sub-path /contact
    location /contact/ {
        rewrite ^/contact/(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Request Laravel Entry Point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Static Assets Caching Optimization
    location /build/ {
        try_files $uri $uri/ =404;
        access_log off;
        expires max;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        access_log off;
        log_not_found off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # PHP-FPM FastCGI Configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param REQUEST_URI $clean_uri;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PREFIX $http_x_forwarded_prefix;

        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
